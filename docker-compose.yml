version: "3.9"

services:

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/backend.Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - CELERY_BROKER_URL=sqla+sqlite:////app/data/celerydb.sqlite
      - CELERY_RESULT_BACKEND=db+sqlite:////app/data/celery_results.sqlite
    volumes:
      - uploads_data:/app/uploads
      - celery_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery worker ───────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: backend/backend.Dockerfile
    command: celery -A backend.worker.celery_app:celery_app worker --loglevel=info --pool=solo --concurrency=1
    restart: unless-stopped
    env_file: .env
    environment:
      - CELERY_BROKER_URL=sqla+sqlite:////app/data/celerydb.sqlite
      - CELERY_RESULT_BACKEND=db+sqlite:////app/data/celery_results.sqlite
    volumes:
      - uploads_data:/app/uploads
      - celery_data:/app/data
    depends_on:
      backend:
        condition: service_healthy

  # ── React frontend (Nginx) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
      args:
        # Frontend calls /api/* which Nginx proxies to backend
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  uploads_data:
  celery_data:
