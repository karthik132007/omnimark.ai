[project]
name = "backend"
version = "0.1.0"
description = "OmniMark Backend API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi~=0.136.1",
    "uvicorn[standard]~=0.34.0",
    "gunicorn~=23.0.0",
    "python-multipart~=0.0.20",
    "pydantic~=2.13.3",
    "email-validator~=2.3.0",
    "python-dotenv~=1.2.2",
    "pyjwt~=2.12.1",
    "bcrypt~=5.0.0",
    "pymongo[srv]~=4.11.1",
    "sqlalchemy~=2.0.0",
    "celery~=5.4.0",
    "openai~=2.33.0",
    "ollama",
    "nltk~=3.9.4",
    "sentence-transformers~=5.4.1",
    "scikit-learn~=1.6.1",
    "pdf2image~=1.17.0",
    "pypdf~=4.2.0",
    "paddleocr~=2.7.3",
    "paddlepaddle>=3.0.0",
    "pandas~=2.2.3",
    "openpyxl~=3.1.5",
    "httpx~=0.28.1",
    "pytest~=9.0.3",
    "pytest-cov~=6.0.0",
    "pytest-mock~=3.14.0",
    "mongomock~=4.1.2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
